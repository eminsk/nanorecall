[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanorecall"
version = "0.1.6"
description = "100% Private, Zero-Cloud, Bare-Metal Desktop Memory & Screen Search Engine (Alternative to Windows Recall — No NPU or Cloud Required, FASM AVX2+FMA/SSE2 Accelerated)."
readme = "README.md"
authors = [
    { name = "eminsk", email = "M_N_Nik@yahoo.com" }
]
license = { text = "MIT" }
keywords = [
    "desktop-memory",
    "screen-search",
    "privacy",
    "recall",
    "vector-search",
    "bare-metal",
    "local-ai",
    "simd",
    "ocr",
    "nanovector",
    "free-threaded",
    "no-gil",
    "pep-703",
    "pypy",
    "pypy3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Desktop Environment",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20, <2; implementation_name == 'pypy' and python_version < '3.10'",
    "numpy>=1.20; (implementation_name != 'pypy' and python_version <= '3.13') or (implementation_name == 'pypy' and python_version >= '3.10' and python_version < '3.12')",
    "numpy>=2.3.0; implementation_name != 'pypy' and python_version >= '3.14' and python_version < '3.16'",
    "typing-extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
desktop = [
    "pillow>=9.0",
]
ai = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0",
]
all = [
    "pillow>=9.0",
]

[project.scripts]
nanorecall = "nanorecall.cli:main"
nanorecall-mcp = "nanorecall.mcp_server:main_mcp"

[project.urls]
Homepage = "https://github.com/eminsk/nanorecall"
Documentation = "https://github.com/eminsk/nanorecall#readme"
Repository = "https://github.com/eminsk/nanorecall"
"Issue Tracker" = "https://github.com/eminsk/nanorecall/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
nanorecall = ["web/*", "*.dll", "*.so", "*.dylib"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

