name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev zlib1g-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel pytest
        python -m pip install "numpy>=1.20,<2; implementation_name == 'pypy' and python_version < '3.10'" "numpy>=1.20; implementation_name != 'pypy' or python_version >= '3.10'" "typing-extensions>=4.0; python_version < '3.10'"
        python -m pip install "pillow>=9.0; implementation_name == 'cpython' or python_version >= '3.11' or sys_platform != 'win32'" || true
        pip install -e . --no-build-isolation || pip install -e .

    - name: Run test suite
      run: |
        pytest -v
