name: Conda Package Build & Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  conda-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Conda Package
        uses: prefix-dev/rattler-build-action@v0
        with:
          recipe-path: recipe/recipe.yaml

      - name: Install Anaconda Client
        run: pip install --upgrade anaconda-client

      - name: Upload to Anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          anaconda --token "$ANACONDA_API_TOKEN" upload --user m_n_nik output/noarch/*.conda --skip-existing
